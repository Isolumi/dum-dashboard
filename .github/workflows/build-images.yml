name: Build and deploy images

on:
  push:
    branches:
      - v1
    paths-ignore:
      - k8s/overlays/dumachine/kustomization.yml

permissions:
  contents: write
  packages: write

concurrency:
  group: dum-dashboard-v1-images
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Build applications
        run: |
          bun run build
          bun run build:gateway

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          tags: ghcr.io/isolumi/dum-dashboard:${{ github.sha }}
          cache-from: type=gha,scope=dum-dashboard
          cache-to: type=gha,mode=max,scope=dum-dashboard

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gateway
          push: true
          tags: ghcr.io/isolumi/homelab-gateway:${{ github.sha }}
          cache-from: type=gha,scope=homelab-gateway
          cache-to: type=gha,mode=max,scope=homelab-gateway

      - name: Update Argo image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s/newTag: .*/newTag: ${IMAGE_TAG}/g" k8s/overlays/dumachine/kustomization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dumachine/kustomization.yml
          git commit -m "chore: deploy ${IMAGE_TAG} [skip ci]"
          git push origin HEAD:v1
