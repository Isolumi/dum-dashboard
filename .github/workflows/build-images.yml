name: Build and deploy images

on:
  workflow_dispatch:
  pull_request:
    branches:
      - v1
  push:
    branches:
      - v1

permissions:
  contents: read

concurrency:
  group: dum-dashboard-v1-images
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.33.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify monitoring values
        run: bun run verify:monitoring

      - name: Render monitoring chart
        run: bash scripts/render-monitoring.sh

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Verify deployment security boundaries
        run: |
          bash scripts/check-readonly-rbac.sh
          bash scripts/check-monies-manifests.sh
          bash -n scripts/check-tailnet-boundary.sh

      - name: Build applications
        run: |
          bun run build
          bun run build:gateway

  build-and-push:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dashboard
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          tags: ghcr.io/isolumi/dum-dashboard:${{ github.sha }}
          cache-from: type=gha,scope=dum-dashboard
          cache-to: type=gha,mode=max,scope=dum-dashboard

      - name: Build and push gateway
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.gateway
          push: true
          tags: ghcr.io/isolumi/homelab-gateway:${{ github.sha }}
          cache-from: type=gha,scope=homelab-gateway
          cache-to: type=gha,mode=max,scope=homelab-gateway

  update-tags:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_BRANCH_SSH_KEY }}

      - name: Update Argo image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:Isolumi/dum-dashboard.git
          git fetch origin v1
          if git fetch origin deploy:refs/remotes/origin/deploy; then
            git switch --create deploy --track origin/deploy
            git merge --no-edit "${IMAGE_TAG}"
          else
            git switch --create deploy "${IMAGE_TAG}"
          fi
          sed -i "s/newTag: .*/newTag: ${IMAGE_TAG}/g" k8s/overlays/dumachine/kustomization.yml
          git add k8s/overlays/dumachine/kustomization.yml
          git commit -m "chore: deploy ${IMAGE_TAG} [skip ci]"
          git push origin HEAD:deploy
