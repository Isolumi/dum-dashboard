apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-gateway-readonly
  labels:
    app.kubernetes.io/name: homelab-gateway
    app.kubernetes.io/part-of: dum-dashboard
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - namespaces
      - events
    verbs:
      - list
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - apps
    resources:
      - deployments
      - daemonsets
      - statefulsets
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-gateway-readonly
  labels:
    app.kubernetes.io/name: homelab-gateway
    app.kubernetes.io/part-of: dum-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homelab-gateway-readonly
subjects:
  - kind: ServiceAccount
    name: homelab-gateway
    namespace: dum-dashboard
