apiVersion: v1
kind: Service
metadata:
  name: homelab-gateway
  namespace: dum-dashboard
  labels:
    app.kubernetes.io/name: homelab-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: dum-dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homelab-gateway
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
