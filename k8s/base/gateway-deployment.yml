apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-gateway
  namespace: dum-dashboard
  labels:
    app.kubernetes.io/name: homelab-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: dum-dashboard
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homelab-gateway
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelab-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: dum-dashboard
    spec:
      serviceAccountName: homelab-gateway
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/isolumi/homelab-gateway:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: homelab-gateway-config
            - secretRef:
                name: homelab-gateway-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: service-catalog
              mountPath: /etc/dum-dashboard/services.yml
              subPath: services.yml
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: service-catalog
          configMap:
            name: homelab-service-catalog
        - name: tmp
          emptyDir: {}
