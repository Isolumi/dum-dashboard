apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-gateway
  namespace: dum-dashboard
  labels:
    app.kubernetes.io/name: homelab-gateway
    app.kubernetes.io/part-of: dum-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-gateway-readonly
  labels:
    app.kubernetes.io/name: homelab-gateway
    app.kubernetes.io/part-of: dum-dashboard
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - namespaces
      - pods
      - pods/log
      - events
      - services
      - endpoints
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - daemonsets
      - statefulsets
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - cert-manager.io
    resources:
      - certificates
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-gateway-readonly
  labels:
    app.kubernetes.io/name: homelab-gateway
    app.kubernetes.io/part-of: dum-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homelab-gateway-readonly
subjects:
  - kind: ServiceAccount
    name: homelab-gateway
    namespace: dum-dashboard
