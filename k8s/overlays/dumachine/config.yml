apiVersion: v1
kind: ConfigMap
metadata:
  name: dum-dashboard-config
  namespace: dum-dashboard
data:
  GATEWAY_URL: http://homelab-gateway.dum-dashboard.svc.cluster.local:8080
  MONIES_API_URL: http://monies.monies.svc.cluster.local:3333
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-gateway-config
  namespace: dum-dashboard
data:
  PROMETHEUS_URL: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
  HOMELAB_SERVICE_CATALOG_PATH: /etc/dum-dashboard/services.yml
  GATEWAY_PROVIDER_TIMEOUT_MS: "5000"
