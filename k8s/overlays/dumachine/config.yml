apiVersion: v1
kind: ConfigMap
metadata:
  name: dum-dashboard-config
  namespace: dum-dashboard
data:
  GATEWAY_URL: http://homelab-gateway.dum-dashboard.svc.cluster.local:8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-gateway-config
  namespace: dum-dashboard
data:
  PROMETHEUS_URL: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
  HOMELAB_SERVICE_CATALOG_PATH: /etc/dum-dashboard/services.yml
  GATEWAY_PROVIDER_TIMEOUT_MS: "5000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-service-catalog
  namespace: dum-dashboard
data:
  services.yml: |
    services:
      - id: yootoob-mp3
        name: yootoob-mp3
        description: Private YouTube MP3 downloader
        url: https://yootoob.doh.lumilumi.xyz
        namespace: yootoob-mp3
        argoApplication: yootoob-mp3-dumachine
        workloads:
          - kind: Deployment
            name: yootoob-mp3-api
          - kind: Deployment
            name: yootoob-mp3-frontend
